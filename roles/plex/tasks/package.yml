---
- name: Ensure plex package
  ansible.builtin.include_role:
    name: damex.apt.apt_packages
  vars:
    apt_packages: # noqa: var-naming[no-role-prefix]
      - name: "{{ plex_package_name }}"
        version: "{{ plex_package_version | default(omit) }}"
        state: "{{ plex_package_state }}"
  when: ansible_facts['pkg_mgr'] == "apt"

- name: Ensure plex package
  ansible.builtin.include_role:
    name: damex.yum.yum_packages
  vars:
    yum_packages: # noqa: var-naming[no-role-prefix]
      - name: "{{ plex_package_name }}"
        version: "{{ plex_package_version | default(omit) }}"
        state: "{{ plex_package_state }}"
  when: ansible_facts['pkg_mgr'] == "yum" or ansible_facts['pkg_mgr'] == "dnf" or ansible_facts['pkg_mgr'] == "dnf5"
